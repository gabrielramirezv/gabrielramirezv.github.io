name: Publish Quarto Website

on:
  push:
    branches: [ main, master ]

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2

      # 1. Renderiza la versión principal (Inglés) en _site/
      - name: Render English Site
        run: quarto render

      # 2. Renderiza la versión en Español en _site/es/
      - name: Render Spanish Site
        run: quarto render --profile es

      # 3. Publica la carpeta _site/ completa a GitHub Pages
      - name: Ensure gh-pages branch exists
        run: |
          if ! git ls-remote --exit-code --heads origin gh-pages; then
            git checkout --orphan gh-pages
            git reset --hard
            git commit --allow-empty -m "Initialize gh-pages branch"
            git push origin gh-pages
            git checkout "${GITHUB_REF_NAME}"
          fi

      - name: Publish to GitHub Pages
        uses: quarto-dev/quarto-actions/publish@v2
        with:
          target: gh-pages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}